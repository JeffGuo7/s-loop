name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CI: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit
        name: Type check

      - run: npx vitest run
        name: Run tests

      - run: npm ci --prefix src-tauri/pi-server
        name: Install pi-server dependencies

      - run: npm run test:server
        name: Run pi-server tests

  windows-native:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure LLVM
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - run: cargo test --manifest-path stt/Cargo.toml --lib
        name: Test local speech engine

      - name: Create generated resource placeholder
        shell: pwsh
        run: New-Item -ItemType File -Path src-tauri/pi-server.zip -Force

      - run: cargo check --manifest-path src-tauri/Cargo.toml
        name: Check Tauri native layer
